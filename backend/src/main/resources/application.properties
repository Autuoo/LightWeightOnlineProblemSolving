server.port=8080
spring.application.name=oj-backend

spring.datasource.url=${OJ_DB_URL:jdbc:mysql://localhost:3306/oj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${OJ_DB_USER:root}
spring.datasource.password=${OJ_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

oj.jwt.secret=${OJ_JWT_SECRET:please-change-this-secret-in-env}
oj.jwt.expire-seconds=7200

oj.sandbox.type=${OJ_SANDBOX_TYPE:process}
oj.sandbox.docker-image=${OJ_SANDBOX_DOCKER_IMAGE:oj-runner:latest}
oj.sandbox.work-dir=${OJ_SANDBOX_WORK_DIR:./oj-sandbox}

oj.judge.concurrency=${OJ_JUDGE_CONCURRENCY:4}
oj.judge.queue-capacity=200
oj.judge.idempotent-window-minutes=10
oj.judge.compile-timeout-seconds=20
oj.judge.compile-output-limit-bytes=8192
oj.judge.time-multiplier.PYTHON3=3
oj.judge.time-multiplier.CPP17=1
oj.judge.time-multiplier.JAVA17=2

oj.ai.enabled=${OJ_AI_ENABLED:false}
oj.ai.base-url=${OJ_AI_BASE_URL:}
oj.ai.api-key=${OJ_AI_API_KEY:}
oj.ai.model=${OJ_AI_MODEL:deepseek-chat}
oj.ai.max-steps=3
oj.ai.timeout-seconds=30
oj.ai.max-tokens=800
oj.ai.temperature=0.2
oj.ai.concurrency=2
oj.ai.daily-user-quota=20
oj.ai.daily-global-quota=500
oj.ai.min-interval-seconds=60

logging.level.root=INFO
logging.level.com.example.oj=DEBUG